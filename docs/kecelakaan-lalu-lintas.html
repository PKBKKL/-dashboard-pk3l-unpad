<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kecelakaan Lalu Lintas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="min-h-screen flex">
    <aside id="sidebar" class="hidden lg:flex fixed left-0 top-0 h-screen w-64 flex-col border-r border-slate-200 bg-white z-20"></aside>
    <main class="flex-1 ml-0 lg:ml-64 px-6 py-6 lg:px-10 lg:py-8 max-w-[1400px]">
      <button id="sidebar-toggle" class="lg:hidden mb-3 p-2 rounded border border-slate-200 bg-white">≡</button>

      <section id="page-header" class="mb-8"></section>
      <section id="kpis" class="grid gap-4 sm:grid-cols-2"></section>

      <section class="mt-8">
        <div class="flex items-baseline justify-between mb-3 flex-wrap gap-2">
          <h3 class="text-sm font-semibold text-slate-900">Rekap per Jenis Kecelakaan</h3>
          <span id="jenis-caption" class="text-xs text-slate-400"></span>
        </div>
        <div id="jenis-cards" class="grid gap-3 grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
      </section>

      <section class="card p-5 mt-8">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <h3 class="text-sm font-semibold text-slate-900">Distribusi Bulanan per Jenis</h3>
          <div id="year-tabs" class="flex gap-1 text-xs"></div>
        </div>
        <p id="year-caption" class="text-xs text-slate-400 mb-3"></p>
        <div id="chart-monthly"></div>
      </section>

      <section class="card overflow-hidden mt-8">
        <header class="px-5 py-4 border-b border-slate-200">
          <h3 id="detail-title" class="text-sm font-semibold text-slate-900">Detail Kasus Berdasarkan Lokasi</h3>
          <p class="text-xs text-slate-400 mt-1">Rincian kasus lengkap dengan lokasi kejadian di kampus. Sumber: sheet "Berdasarkan Lokasi" pada Excel Kecelakaan Lalu Lintas.</p>
        </header>
        <div class="overflow-x-auto">
          <table class="data-table" id="detail-table">
            <thead><tr>
              <th class="num">No</th>
              <th>Bulan</th>
              <th>Jenis Kecelakaan</th>
              <th>Lokasi</th>
              <th class="num">Jumlah</th>
              <th>Catatan</th>
            </tr></thead>
            <tbody></tbody>
            <tfoot></tfoot>
          </table>
        </div>
      </section>

      <section id="flags" class="mt-8"></section>
      <footer id="page-footer"></footer>
    </main>
  </div>

  <script type="module">
    import {
      bootstrap, renderHeader, renderKpis, renderFlags, $, MONTH_SHORT,
      loadDataset, loadShared, fmtInt, fmtMonth,
    } from "./assets/common.js";
    import { stackedBar } from "./assets/charts.js";

    const meta = await bootstrap("kecelakaan-lalu-lintas.html");
    const [data, locsData] = await Promise.all([
      loadDataset("traffic_accidents"),
      loadShared("locations"),
    ]);
    const p = meta.color_palette;
    const locations = locsData.locations;
    const typeLabels = Object.fromEntries(data.vehicle_types.map(v => [v.id, v.label]));

    renderHeader({
      title: "Kecelakaan Lalu Lintas",
      period: `${data.period.start} – ${data.period.end}`,
      description: "Pencatatan kecelakaan di kawasan kampus UNPAD oleh Kantor Lingkungan. Mencakup kecelakaan tunggal, tabrakan antar pengguna jalan, serta insiden yang melibatkan armada sepeda listrik Beam. Tahun berjalan masih parsial.",
    });

    // Tahun tidak dihafal: ambil apa adanya dari data, urut menaik.
    const YEARS = data.yearly.map(y => y.year).sort((a, b) => a - b);
    const LATEST = YEARS[YEARS.length - 1];
    const byYear = Object.fromEntries(data.yearly.map(y => [y.year, y]));

    renderKpis("#kpis", YEARS.map((yr, i) => ({
      label: yr === LATEST && YEARS.length > 1 ? `YTD ${yr}` : `Total ${yr}`,
      value: fmtInt(byYear[yr]?.total_yearly_computed ?? 0),
      unit: "kasus",
      icon: i === 0 ? "car-front" : undefined,
      accent: yr === LATEST ? "amber" : "red",
    })));

    const PALETTE_CYCLE = [p.exceedance, p.maggot, p.anorganik, p.organik, p.rdf, p.residu, p.dumping, p.kompos];

    // ─── Mini-cards per Jenis Kecelakaan ──────────────────────────────
    const blankYears = () => Object.fromEntries(YEARS.map(y => [y, 0]));
    const typeTotals = {};
    data.vehicle_types.forEach(v => { typeTotals[v.id] = { total: 0, perYear: blankYears() }; });
    for (const yr of data.yearly) {
      for (const m of yr.monthly) {
        for (const [tid, count] of Object.entries(m.by_type)) {
          if (!typeTotals[tid]) typeTotals[tid] = { total: 0, perYear: blankYears() };
          typeTotals[tid].total += count;
          typeTotals[tid].perYear[yr.year] = (typeTotals[tid].perYear[yr.year] ?? 0) + count;
        }
      }
    }
    const totalAllYears = Object.values(typeTotals).reduce((a, t) => a + t.total, 0);

    const jenisSorted = data.vehicle_types
      .map((v, i) => ({ ...v, idx: i, ...typeTotals[v.id] }))
      .sort((a, b) => b.total - a.total);

    $("#jenis-cards").innerHTML = jenisSorted.map(v => {
      const color = PALETTE_CYCLE[v.idx % PALETTE_CYCLE.length];
      const pct = totalAllYears ? (v.total / totalAllYears * 100).toFixed(1) : "0.0";
      return `
        <div class="rounded-lg border border-slate-200 p-3 bg-white flex items-start gap-3">
          <span class="mt-1 inline-block w-3 h-3 rounded-full flex-shrink-0" style="background:${color}"></span>
          <div class="flex-1 min-w-0">
            <div class="text-[11px] font-medium text-slate-500 leading-tight">${v.label}</div>
            <div class="mt-1 flex items-baseline gap-1.5">
              <div class="text-2xl font-bold text-slate-900 tabular-nums">${v.total}</div>
              <div class="text-[10px] text-slate-400">kasus · ${pct}%</div>
            </div>
            <div class="text-[10px] text-slate-500 mt-1 flex gap-2">
              ${YEARS.map((yr, i) => `
                ${i ? `<span class="text-slate-300">|</span>` : ""}
                <span>${yr}: <span class="font-medium text-slate-700 tabular-nums">${v.perYear[yr] ?? 0}</span></span>
              `).join("")}
            </div>
          </div>
        </div>`;
    }).join("");

    let currentYear = YEARS[0];

    function renderTabs() {
      $("#year-tabs").innerHTML = YEARS.map(y => `
        <button data-year="${y}" class="px-3 py-1.5 rounded-md border ${currentYear === y ? "bg-green-100 border-green-300 text-green-800 font-medium" : "border-slate-200 text-slate-600 bg-white"}">${y}</button>
      `).join("");
      document.querySelectorAll("[data-year]").forEach(btn => {
        btn.onclick = () => { currentYear = Number(btn.dataset.year); renderTabs(); renderChart(); };
      });
    }
    function renderChart() {
      const y = data.yearly.find(y => y.year === currentYear);
      const series = data.vehicle_types.map((v, i) => ({
        label: v.label,
        color: PALETTE_CYCLE[i % PALETTE_CYCLE.length],
        y: MONTH_SHORT.map((_, idx) => {
          const monthIso = `${currentYear}-${String(idx + 1).padStart(2, "0")}`;
          const row = y?.monthly.find(mm => mm.month === monthIso);
          return row?.by_type[v.id] ?? 0;
        }),
      }));
      stackedBar("chart-monthly", { x: MONTH_SHORT, yLabel: "Jumlah Kasus", series });

      const peak = (y?.monthly ?? []).reduce((a, m) => (!a || m.total > a.total ? m : a), null);
      if (currentYear === LATEST && YEARS.length > 1) {
        $("#year-caption").textContent =
          `Data ${currentYear} masih parsial (YTD: ${y?.total_yearly_computed ?? 0} kasus).`;
      } else if (peak) {
        $("#year-caption").textContent =
          `${fmtMonth(peak.month)} adalah puncak dengan ${peak.total} kasus.`;
      } else {
        $("#year-caption").textContent = `Belum ada kasus tercatat pada ${currentYear}.`;
      }
    }

    $("#jenis-caption").textContent = `Akumulasi ${YEARS.join(" + ")} · diurut berdasarkan frekuensi`;

    renderTabs();
    renderChart();

    // spec 1.1 memakai `incidents_detail`; JSON lama (1.0) memakai `incidents_detail_2026`.
    const incidents = data.incidents_detail ?? data.incidents_detail_2026 ?? [];
    const detailYears = [...new Set(incidents.map(it => it.year ?? Number(String(it.month).slice(0, 4))))].sort();
    $("#detail-title").textContent = detailYears.length
      ? `Detail Kasus ${detailYears.join(" & ")} Berdasarkan Lokasi`
      : "Detail Kasus Berdasarkan Lokasi";

    if (incidents.length === 0) {
      $("#detail-table tbody").innerHTML = `
        <tr><td colspan="6" class="text-center text-slate-400 text-xs py-6">Belum ada detail lokasi yang tercatat di Excel.</td></tr>`;
    } else {
      $("#detail-table tbody").innerHTML = incidents.map(it => `
        <tr>
          <td class="num text-slate-600">${it.no ?? ""}</td>
          <td>${fmtMonth(it.month)}</td>
          <td>${typeLabels[it.type] ?? it.type}</td>
          <td>${locations[it.location_id]?.label ?? it.location_label_raw}</td>
          <td class="num tabular-nums">${it.count}</td>
          <td class="text-xs text-slate-500">${it.note ?? ""}</td>
        </tr>
      `).join("");
      const totalDetail = incidents.reduce((a, it) => a + (it.count ?? 0), 0);
      const uniqueLoc = new Set(incidents.map(it => it.location_id)).size;
      const uniqueMonth = new Set(incidents.map(it => it.month)).size;
      $("#detail-table tfoot").innerHTML = `
        <tr class="border-t-2 border-slate-300 bg-slate-50 font-semibold text-slate-700">
          <td class="num" colspan="4">TOTAL · ${uniqueMonth} bulan · ${uniqueLoc} lokasi</td>
          <td class="num tabular-nums">${totalDetail}</td>
          <td class="text-xs text-slate-400">kasus tercatat dengan lokasi</td>
        </tr>`;
    }

    renderFlags(data.data_quality_flags);
  </script>
</body>
</html>
